<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bendito Lanches – Faça seu pedido</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--red:#ca1b1f;--yel:#f7e72d;--bg:#fff8d6;--card:#fff;--tx:#3b1218;--mut:#7a5a5e;--line:#eadfb0;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a0d10;--card:#3a1418;--tx:#fdf3d0;--mut:#d3b9a8;--line:#5a2a2e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2a0d10;--card:#3a1418;--tx:#fdf3d0;--mut:#d3b9a8;--line:#5a2a2e;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:90px}
header{background:var(--red);text-align:center;padding:0 0 12px}
header img{display:block;width:100%;max-width:680px;height:auto;margin:0 auto}
header p{margin:6px 12px 0;color:#fff;font-size:14px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--red);display:flex;gap:6px;overflow-x:auto;padding:8px;border-top:1px solid #0003}
nav a{flex:none;background:var(--yel);color:#3b1218;text-decoration:none;font-weight:700;font-size:13px;padding:6px 12px;border-radius:99px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--red);z-index:10}
main{max-width:680px;margin:0 auto;padding:8px 12px}
h2{color:var(--red);font-size:22px;margin:22px 0 6px;border-bottom:3px solid var(--yel)}
@media (prefers-color-scheme:dark){h2{color:var(--yel)}}
.sub{font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin:12px 0 2px}
.it{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin:6px 0}
.it .n{flex:1;font-weight:600}.it .p{color:var(--mut);font-size:14px}
.q{display:flex;align-items:center;gap:8px}
.q button{width:32px;height:32px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:20px;line-height:1;cursor:pointer}
.q button.m{background:var(--line);color:var(--tx)}
.q span{min-width:18px;text-align:center;font-weight:700}
.note{font-size:13px;color:var(--mut);margin:4px 2px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:20px 12px}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--red);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));z-index:6}
#bar button{width:100%;max-width:680px;display:block;margin:auto;border:0;border-radius:12px;background:var(--yel);color:#3b1218;font-weight:800;font-size:17px;padding:13px;cursor:pointer}
#bar button:disabled{opacity:.6}
#ck{position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:flex-end;justify-content:center}
#ck.on{display:flex}
.sh{background:var(--bg);width:100%;max-width:680px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sh h3{margin:0 0 8px;color:var(--red)}
@media (prefers-color-scheme:dark){.sh h3{color:var(--yel)}}
.ln{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line);font-size:15px}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin-top:12px}
.go{width:100%;margin-top:14px;border:0;border-radius:12px;background:#25d366;color:#fff;font-weight:800;font-size:17px;padding:14px;cursor:pointer}
.cl{width:100%;margin-top:8px;border:0;background:none;color:var(--mut);font:inherit;padding:8px;cursor:pointer}
.err{color:#d12;font-size:13px;margin-top:6px;min-height:16px}
</style>
</head>

<footer>Bendito Lanches · Rua Adalgisa Luna de Menezes, 641 – Bancários<br>Os valores seguem o cardápio da casa.</footer>

<div id="bar"><button id="open" disabled>Seu carrinho está vazio</button></div>

<div id="ck"><div class="sh">
<h3>Finalizar pedido</h3>
<div id="lines"></div>
<div class="tot"><span>Total</span><span id="tot"></span></div>
<p class="note">Taxa de entrega, se houver, é combinada pelo WhatsApp.</p>
<label for="nm">Seu nome</label>
<input id="nm" autocomplete="name" placeholder="Nome">
<label for="tp">Como deseja receber?</label>
<select id="tp"><option value="Entrega">Entrega</option><option value="Retirada no local">Retirada no local</option></select>
<div id="adw">
<label for="ad">Endereço de entrega</label>
<input id="ad" autocomplete="street-address" placeholder="Rua, número, bairro e ponto de referência">
</div>
<label for="pg">Pagamento</label>
<select id="pg"><option>Pix</option><option>Dinheiro</option><option>Cartão de crédito</option><option>Cartão de débito</option></select>
<label for="ob">Observações (sabor da crepioca, sabores do brotinho, adicionais…)</label>
<textarea id="ob" rows="3" placeholder="Ex.: crepioca de queijo; sem cebola"></textarea>
<div class="err" id="err"></div>
<button class="go" id="send">Enviar pedido no WhatsApp</button>
<button class="cl" id="close">Voltar ao cardápio</button>
</div></div>

<script>
// Número do WhatsApp com código do país (55) + DDD (83) + número.
// Se o número correto for outro, altere apenas esta linha.
var WA = "5583986820377";

var M = [
["Pastel Salgado",[
["Tradicional","Frango|8;Misto|8;Calabresa|8;Queijo|9;Bacon|10;Pizza|10;Carne Moída|10;Carne de Sol|10"],
["Especial","Calabresa e Cebola|9;Calabresa e Queijo|10;Frango e Calabresa|10;Frango e Catupiry|10;Frango e Requeijão|10;Frango e Queijo|10;Frango, Azeitona e Milho|10;Frango e Cream Cheese|13;Quatro Queijos|14;Carne de Sol c/ Queijo Coalho|12;Carne c/ Cream Cheese|14;Cachorro Quente|16;Carne de Sol na Nata|16"]]],
["Pastel Doce",[
["Tradicional","Cartola|10;Romeu e Julieta|10;Chocolate ao Leite|10;Chocolate Branco|10;Doce de Leite|10"],
["Especial","Paçoca e Doce de Leite|12;Doce de Leite e Coco|12;Prestígio|12;Dois Amores|12;Carne com Açúcar|13;Chocolate e M&M|13;Chocolate Branco e Morango|13;Nutella|14;Morango e Nutella|16"]]],
["Tapioca",[
["Salgada","Ovo|5;Coco|6;Misto|8;Frango|8;Calabresa|8;Queijo|8;Calabresa e Cebola|8;Bacon|9;Calabresa e Queijo|9;Carne de Sol|10;Frango e Calabresa|10;Frango e Catupiry|10;Frango e Requeijão|10;Frango e Queijo|10;Frango, Azeitona e Milho|10;Frango e Cream Cheese|12;Carne de Sol c/ Queijo Coalho|12;Quatro Queijos|13;Carne c/ Cream Cheese|13"],
["Doce","Cartola|9;Romeu e Julieta|9;Chocolate ao Leite|9;Chocolate Branco|9;Doce de Leite|9;Paçoca e Doce de Leite|11;Doce de Leite e Coco|11;Prestígio|11;Dois Amores|11;Nutella|13;Morango e Nutella|15"]]],
["Outros",[
["Crepioca","Crepioca (um sabor)|9"],
["Batata Frita","Batata Frita Simples|10;Batata Frita Recheada|18"],
["Pizza Brotinho","Pizza Brotinho (sabor nas observações)|10"],
["Cuscuz Recheado","Cuscuz Recheado (2 sabores + vinagrete)|15"]]],
["Bebidas",[
["Suco 500ml","Laranja|8;Limão|7;Maracujá|7;Cajá|7;Cajú|7;Manga|7;Goiaba|7;Graviola|7;Uva|7;Cupuaçu|7;Morango|7;Mangaba|7;Adicional de leite no suco|1"],
["Vitaminas","Vitamina de Açaí|15;Vitamina de Banana|7"],
["Refrigerantes","Refrigerante 250ml|3.5;Refrigerante Lata|5;Coca-Cola 1L|8;Guaraná 1L|7;Coca-Cola 1,5L|10"],
["Outras","H2O|7;Água com Gás|3.5;Água sem Gás|2.5;Café|2.5;Café com Leite|3"]]]
];
var NOTES = {"Outros":"Sobremesas: consulte sabor e valor pelo WhatsApp. Adicionais: R$ 2,00 cada sabor (carne, chocolate e cream cheese: R$ 4,00) – informe nas observações."};

var cart = {}, items = [];
var $ = function(i){return document.getElementById(i)};
var brl = function(v){return "R$ " + v.toFixed(2).replace(".", ",")};

function build(){
  var h = "", nv = "";
  M.forEach(function(c, ci){
    nv += '<a href="#c' + ci + '">' + c[0] + '</a>';
    h += '<h2 id="c' + ci + '">' + c[0] + '</h2>';
    if (NOTES[c[0]]) h += '<p class="note">' + NOTES[c[0]] + '</p>';
    c[1].forEach(function(s){
      h += '<div class="sub">' + s[0] + '</div>';
      s[1].split(";").forEach(function(r){
        var p = r.split("|"), id = items.length;
        items.push({n: p[0], p: parseFloat(p[1]), g: c[0] + " – " + s[0]});
        h += '<div class="it"><div class="n">' + p[0] + '<div class="p">' + brl(parseFloat(p[1])) + '</div></div>' +
          '<div class="q"><button class="m" data-i="' + id + '" data-d="-1" aria-label="Remover">−</button><span id="q' + id + '">0</span>' +
          '<button data-i="' + id + '" data-d="1" aria-label="Adicionar">+</button></div></div>';
      });
    });
  });
  $("nav").innerHTML = nv;
  $("menu").innerHTML = h;
}

function total(){
  var t = 0, n = 0;
  for (var k in cart){ t += items[k].p * cart[k]; n += cart[k]; }
  return {t: t, n: n};
}
function refresh(){
  var s = total(), b = $("open");
  b.disabled = s.n === 0;
  b.textContent = s.n === 0 ? "Seu carrinho está vazio" : "Ver pedido · " + s.n + (s.n > 1 ? " itens" : " item") + " · " + brl(s.t);
}

$("menu").addEventListener("click", function(e){
  var b = e.target.closest("button[data-i]");
  if (!b) return;
  var i = +b.dataset.i, d = +b.dataset.d, q = (cart[i] || 0) + d;
  if (q <= 0) delete cart[i]; else cart[i] = q;
  $("q" + i).textContent = cart[i] || 0;
  refresh();
});

function lines(){
  var h = "";
  for (var k in cart) h += '<div class="ln"><span>' + cart[k] + '× ' + items[k].n + '</span><span>' + brl(items[k].p * cart[k]) + '</span></div>';
  $("lines").innerHTML = h;
  $("tot").textContent = brl(total().t);
}
$("open").onclick = function(){ lines(); $("ck").classList.add("on"); };
$("close").onclick = function(){ $("ck").classList.remove("on"); };
$("tp").onchange = function(){ $("adw").style.display = this.value === "Entrega" ? "" : "none"; };

$("send").onclick = function(){
  var nm = $("nm").value.trim(), tp = $("tp").value, ad = $("ad").value.trim(), er = $("err");
  if (!total().n){ er.textContent = "Adicione pelo menos um item."; return; }
  if (!nm){ er.textContent = "Informe seu nome."; return; }
  if (tp === "Entrega" && !ad){ er.textContent = "Informe o endereço de entrega."; return; }
  er.textContent = "";
  var m = "*Novo pedido – Bendito Lanches* 🥟\n\n*Cliente:* " + nm + "\n\n*Itens:*\n";
  for (var k in cart) m += "• " + cart[k] + "x " + items[k].n + " – " + brl(items[k].p * cart[k]) + "\n";
  m += "\n*Total dos itens:* " + brl(total().t) + "\n*Recebimento:* " + tp + "\n";
  if (tp === "Entrega") m += "*Endereço:* " + ad + "\n";
  m += "*Pagamento:* " + $("pg").value + "\n";
  var ob = $("ob").value.trim();
  if (ob) m += "*Obs.:* " + ob + "\n";
  window.open("https://wa.me/" + WA + "?text=" + encodeURIComponent(m), "_blank");
};

build(); refresh();
</script>
